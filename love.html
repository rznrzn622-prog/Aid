<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Animation</title>

<style>
body{
    margin:0;
    background:black;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

.heart{
    position:relative;
    width:500px;
    height:500px;
}

.word{
    position:absolute;
    color:#ff4da6;
    font-size:18px;
    font-weight:bold;
    animation:pulse 1.5s infinite alternate;
}

@keyframes pulse{
    from{
        transform:scale(1);
        text-shadow:0 0 5px #ff4da6;
    }
    to{
        transform:scale(1.2);
        text-shadow:0 0 20px #ff4da6;
    }
}

h1{
    position:absolute;
    color:white;
    top:40px;
    font-size:40px;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0.5;
    }
}
</style>
</head>

<body>

<h1>❤️ زهراء ❤️</h1>

<div class="heart" id="heart"></div>

<audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
</audio>

<script>
const heart = document.getElementById("heart");

for(let t = 0; t < Math.PI * 2; t += 0.09){

    let x = 16 * Math.pow(Math.sin(t),3);
    let y = 13*Math.cos(t)
          - 5*Math.cos(2*t)
          - 2*Math.cos(3*t)
          - Math.cos(4*t);

    let div = document.createElement("div");

    div.className = "word";
    div.innerText = "I love you";

    div.style.left = (x * 15 + 200) + "px";
    div.style.top  = (-y * 15 + 200) + "px";

    heart.appendChild(div);
}
</script>

</body>
</html>
